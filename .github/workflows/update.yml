name: update

on:
  schedule:
    - cron: "0 6 * * *" # 09:00 Moscow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Update sources
        run: ./update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build check
        run: nix-build --no-out-link -E 'with import <nixpkgs> {}; callPackage ./package.nix {}'
      - name: Commit if changed
        run: |
          if git diff --quiet -- sources.json; then
            echo "Already up to date"
            exit 0
          fi
          version=$(jq -r .version sources.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "uvtools: update to $version"
          git push
